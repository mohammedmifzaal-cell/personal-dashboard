function makeStore(uid) {
  return {
    async loadJSON(key, fallback) {
      if (!uid || !window.Fb) return fallback;
      try {
        const { db, doc, getDoc } = window.Fb;
        const ref = doc(db, "users", uid, "data", key);
        const snap = await getDoc(ref);
        if (!snap.exists()) return fallback;
        const data = snap.data();
        return data && typeof data.value === "string" ? JSON.parse(data.value) : fallback;
      } catch (e) { console.error("loadJSON failed", key, e); return fallback; }
    },
    async saveJSON(key, value) {
      if (!uid || !window.Fb) return;
      try {
        const { db, doc, setDoc } = window.Fb;
        const ref = doc(db, "users", uid, "data", key);
        await setDoc(ref, { value: JSON.stringify(value), updatedAt: Date.now() });
      } catch (e) { console.error("saveJSON failed", key, e); }
    },
  };
}

function useFirebaseReady() {
  const [ready, setReady] = useState(!!window.Fb);
  useEffect(() => {
    if (window.Fb) { setReady(true); return; }
    const h = () => setReady(true);
    window.addEventListener("fb-ready", h);
    return () => window.removeEventListener("fb-ready", h);
  }, []);

}

function computeHistoricalCompletions(pattern, from, to) {
  const dates = [];
  let cursor = new Date(from);
  while (cursor <= to) {
    const due = nextDue(pattern, cursor);
    if (!due || due > to) break;
    dates.push(isoDate(due));
    cursor = new Date(due.getTime() + 86400000);
  }
  return dates;
}

/* ============================== DATE HELPERS ============================== */
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmt(d) { const dt = new Date(d); return `${dt.getDate()} ${MONTH_NAMES[dt.getMonth()]} ${dt.getFullYear()}`; }
function isoDate(d) { const dt = new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }
function lastDayOfMonth(year, month) { return new Date(year, month + 1, 0); }
function startOfWeek(d) { const dt = new Date(d); const day = dt.getDay(); dt.setDate(dt.getDate() - day); dt.setHours(0, 0, 0, 0); return dt; }
function nextDue(pattern, from) {
  const d = new Date(from); d.setHours(0, 0, 0, 0);
  if (pattern.type === "monthly-last") { let c = lastDayOfMonth(d.getFullYear(), d.getMonth()); if (c < d) c = lastDayOfMonth(d.getFullYear(), d.getMonth() + 1); return c; }
  if (pattern.type === "monthly-day") { let c = new Date(d.getFullYear(), d.getMonth(), pattern.day); if (c < d) c = new Date(d.getFullYear(), d.getMonth() + 1, pattern.day); return c; }
  if (pattern.type === "yearly-dates") {
    const candidates = pattern.dates.map(([m, day]) => { let year = d.getFullYear(); let c = new Date(year, m - 1, day); if (c < d) c = new Date(year + 1, m - 1, day); return c; });
    candidates.sort((a, b) => a - b); return candidates[0];
  }
  if (pattern.type === "once") return new Date(pattern.date);
  return null;
}
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function currentQuarter(d) { return Math.floor(d.getMonth() / 3) + 1; }
function quarterEndDate(d) { const q = currentQuarter(d); return lastDayOfMonth(d.getFullYear(), q * 3 - 1); }
function quarterStartDate(d) { const q = currentQuarter(d); return new Date(d.getFullYear(), (q - 1) * 3, 1); }

function isRecurringTask(task) { return task?.pattern?.type && task.pattern.type !== "once"; }
function completedDateSet(task) { return new Set(task.completedDates || []); }
function nextOpenDue(task, from) {
  if (!task?.pattern) return null;
  if (!isRecurringTask(task)) return nextDue(task.pattern, from);
  const done = completedDateSet(task);
  let cursor = new Date(from);
  cursor.setHours(0, 0, 0, 0);
  for (let i = 0; i < 60; i++) {
    const due = nextDue(task.pattern, cursor);
    if (!due) return null;
    if (!done.has(isoDate(due))) return due;
    cursor = new Date(due.getTime() + 86400000);
  }
  return null;
}
function completionEvents(tasks) {
  const events = [];
  tasks.forEach((t) => {
    (t.completedDates || []).forEach((date) => events.push({ ...t, completionDate: date, due: new Date(date + "T00:00:00"), eventId: `${t.id}::${date}` }));
    if (!isRecurringTask(t) && t.status === "Completed" && !(t.completedDates || []).length) {
      const due = nextDue(t.pattern, new Date());
      if (due) events.push({ ...t, completionDate: isoDate(due), due, eventId: `${t.id}::${isoDate(due)}` });
    }
  });
  return events.sort((a, b) => b.due - a.due);
}
function completionPeriodLabel(task, dateString) {
  const d = new Date(dateString + "T00:00:00");
  if (task.periodGroup === "quarter-end") {
    const month = d.getMonth() + 1;
    let year = d.getFullYear();
    let q;
    if (month % 3 === 0) q = Math.ceil(month / 3);
    else {
      const prev = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      q = currentQuarter(prev); year = prev.getFullYear();
    }
    return `Q${q} ${year}`;
  }
  if (task.periodGroup === "month-end") return `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  return fmt(d);
}
function migrateTasksForCompletionModel(list) {
  const joined = new Date(2026, 2, 23);
  const completedThrough = new Date(2026, 6, 31); // through Jul 2026 only; Aug onward stays pending
  return (list || []).map((t) => {
    let completedDates = Array.isArray(t.completedDates) ? [...t.completedDates] : [];
    if (t.source === "Todoist" && isRecurringTask(t) && (t.periodGroup === "month-end" || t.periodGroup === "quarter-end")) {
      completedDates = [...new Set([...computeHistoricalCompletions(t.pattern, joined, completedThrough), ...completedDates])].sort();
    }
    return {
      ...t,
      completedDates,
      // Recurring work is never permanently "Completed"; each completed cycle lives in completedDates.
      status: isRecurringTask(t) && t.status === "Completed" ? "Not Started" : t.status,
    };
  });
}

}
function Button({ children, onClick, variant = "primary", size = "md", icon, disabled, type = "button" }) {
  const base = "inline-flex items-center gap-1.5 font-medium transition-colors disabled:opacity-40";
  const sizes = size === "sm" ? "px-2.5 py-1.5 text-xs" : "px-3.5 py-2 text-sm";
  const styles = {
    primary: { background: TEAL, color: ON_ACCENT, borderRadius: 3, border: "1px solid transparent" },

  return (
    <button type={type} disabled={disabled} onClick={onClick} className={`${base} ${sizes}`} style={styles[variant]}>
      {icon && <Icon name={icon} size={size === "sm" ? 14 : 16} />}
      {children}

}
function Field({ label, children }) { return <label className="block mb-3"><div className="text-xs font-medium mb-1" style={{ color: MUTE }}>{label}</div>{children}</label>; }
const inputStyle = { background: SLATE_2, border: "1px solid " + LINE, color: FOAM, borderRadius: 3 };
function TextInput(props) { return <input {...props} className={`w-full px-3 py-2 text-sm outline-none ${props.className || ""}`} style={inputStyle} />; }
function Select(props) { return <select {...props} className={`w-full px-3 py-2 text-sm outline-none ${props.className || ""}`} style={inputStyle} />; }

/* ============================== LIGHTWEIGHT CHARTS (no chart library) ============================== */
function DonutChart({ data, size = 170, thickness = 26 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (!total) return <EmptyState icon="barChart" title="No data yet" body="Log some work to see the breakdown." />;
  let acc = 0;
  const stops = data.map((d) => { const start = (acc / total) * 360; acc += d.value; const end = (acc / total) * 360; return `${d.color} ${start}deg ${end}deg`; }).join(", ");
  return (
    <div className="flex items-center gap-5 flex-wrap">
      <div style={{ width: size, height: size, borderRadius: "50%", background: `conic-gradient(${stops})`, position: "relative", flexShrink: 0 }}>
        <div style={{ position: "absolute", inset: thickness, borderRadius: "50%", background: SLATE }} />
      </div>
      <div className="space-y-1.5">
        {data.map((d, i) => (
          <div key={i} className="flex items-center gap-2 text-xs">
            <span style={{ width: 8, height: 8, borderRadius: 9999, background: d.color, display: "inline-block" }} />
            <span style={{ color: FOAM }}>{d.name}</span>
            <span className="font-mono" style={{ color: MUTE }}>{d.value.toFixed(1)}h</span>
          </div>
        ))}
      </div>
    </div>
  );
}
function SimpleBarChart({ data }) {
  const max = Math.max(1, ...data.map((d) => d.hours));
  return (
    <div className="space-y-3">
      {data.map((d, i) => (
        <div key={i}>
          <div className="flex justify-between text-xs mb-1"><span style={{ color: FOAM }}>{d.name}</span><span className="font-mono" style={{ color: MUTE }}>{d.hours.toFixed(1)}h</span></div>
          <div className="h-2 rounded-full overflow-hidden" style={{ background: "rgba(23,43,77,0.08)" }}>
            <div className="h-full rounded-full" style={{ width: `${(d.hours / max) * 100}%`, background: TEAL }} />
          </div>
        </div>
      ))}
    </div>
  );
}

/* ============================== DASHBOARD ============================== */
function Dashboard({ settings, tasks, catMap, projMap, now }) {
  const qStart = quarterStartDate(now), qEnd = quarterEndDate(now);

  const withDue = tasks
    .filter((t) => t.status !== "Cancelled" && !( !isRecurringTask(t) && t.status === "Completed" ))
    .map((t) => ({ ...t, due: nextOpenDue(t, now) }))
    .filter((t) => t.due)
    .sort((a, b) => a.due - b.due);
  const upcoming = withDue.filter((t) => daysBetween(now, t.due) <= 14 && daysBetween(now, t.due) >= 0);
  const monthEnd = withDue.filter((t) => t.periodGroup === "month-end" && t.due.getMonth() === now.getMonth() && t.due.getFullYear() === now.getFullYear());
  const quarterEndTasks = withDue.filter((t) => t.periodGroup === "quarter-end" && t.due >= qStart && t.due <= new Date(qEnd.getTime() + 35 * 86400000));
  const tasksRemaining = withDue.length;
  const inProgress = withDue.filter((t) => t.status === "In Progress").length;
  const recentlyDone = completionEvents(tasks).slice(0, 6);

  return (
    <div className="space-y-8">
      <div><div className="text-sm" style={{ color: MUTE }}>{greeting(now)},</div><h1 className="text-3xl" style={{ color: FOAM }}>{settings.name}</h1></div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="Tasks due (14d)" value={upcoming.length} sub={`${tasksRemaining} active occurrences`} />
        <StatCard label="In progress" value={inProgress} sub="on the board right now" />
        <StatCard label="Next deadline" value={upcoming[0] ? fmt(upcoming[0].due) : "—"} sub={upcoming[0]?.title || "Nothing imminent"} small />
        <StatCard label="Quarter" value={`Q${currentQuarter(now)} ${now.getFullYear()}`} sub={`ends ${fmt(qEnd)}`} small />
      </div>

      <div className="grid md:grid-cols-2 gap-6">
        <Card className="p-5">
          <div className="flex items-center justify-between mb-3"><h2 className="text-lg" style={{ color: FOAM }}>Upcoming work</h2><span className="text-xs" style={{ color: MUTE }}>next 14 days</span></div>
          {upcoming.length === 0 ? <div className="text-sm py-4" style={{ color: MUTE }}>Nothing due in the next two weeks.</div> : <div className="space-y-2">{upcoming.slice(0, 6).map((t) => <TaskRow key={`${t.id}-${isoDate(t.due)}`} task={t} catMap={catMap} projMap={projMap} />)}</div>}
        </Card>
        <Card className="p-5">
          <h2 className="text-lg mb-3" style={{ color: FOAM }}>Period-end work</h2>
          <div className="mb-4">
            <div className="text-xs uppercase tracking-wide mb-2" style={{ color: GOLD }}>{MONTH_NAMES[now.getMonth()]} month-end</div>
            {monthEnd.length === 0 ? <div className="text-sm" style={{ color: MUTE }}>No month-end items flagged.</div> : monthEnd.map((t) => <TaskRow key={`${t.id}-${isoDate(t.due)}`} task={t} catMap={catMap} projMap={projMap} compact />)}
          </div>
          <div>
            <div className="text-xs uppercase tracking-wide mb-2" style={{ color: GOLD }}>Q{currentQuarter(now)} {now.getFullYear()} quarter-end cycle</div>
            {quarterEndTasks.length === 0 ? <div className="text-sm" style={{ color: MUTE }}>No quarter-end items flagged.</div> : quarterEndTasks.map((t) => <TaskRow key={`${t.id}-${isoDate(t.due)}`} task={t} catMap={catMap} projMap={projMap} compact />)}
          </div>
        </Card>
      </div>

      <Card className="p-5">
        <div className="flex items-center justify-between mb-3"><h2 className="text-lg" style={{ color: FOAM }}>Recently completed</h2><span className="text-xs" style={{ color: MUTE }}>same history used by Board</span></div>
        {recentlyDone.length === 0 ? <EmptyState icon="listChecks" title="Nothing completed yet" body="Complete a task on the Board and it will appear here." /> : (
          <div className="space-y-2">{recentlyDone.map((t) => (
            <div key={t.eventId} className="flex items-center justify-between gap-4 text-sm py-2" style={{ borderBottom: "1px solid " + LINE }}>
              <div className="min-w-0"><div className="truncate" style={{ color: FOAM }}>{t.title}</div><div className="flex items-center gap-1.5 mt-1">{projMap[t.project] && <Badge color={projMap[t.project].color}>{projMap[t.project].name}</Badge>}<span className="text-xs" style={{ color: MUTE }}>{completionPeriodLabel(t, t.completionDate)}</span></div></div>
              <span className="text-xs font-mono shrink-0" style={{ color: MUTE }}>{fmt(t.due)}</span>
            </div>
          ))}</div>
        )}
      </Card>
    </div>
  );
}
function greeting(now) { const h = now.getHours(); if (h < 12) return "Good morning"; if (h < 17) return "Good afternoon"; return "Good evening"; }
function StatCard({ label, value, sub, small }) {
  return <Card className="p-4"><div className="text-xs mb-1" style={{ color: MUTE }}>{label}</div><div className={small ? "text-base" : "font-mono text-2xl"} style={{ color: FOAM, fontFamily: small ? undefined : "'JetBrains Mono', monospace" }}>{value}</div>{sub && <div className="text-xs mt-1 truncate" style={{ color: MUTE }}>{sub}</div>}</Card>;
}
function TaskRow({ task, catMap, projMap, compact, onClick }) {
  const cat = catMap[task.category], proj = projMap[task.project];
  const overdue = task.status !== "Completed" && task.due < new Date(new Date().toDateString());
  return (
    <div onClick={onClick} className={`flex items-center justify-between py-2 ${compact ? "" : "px-2 -mx-2 rounded-lg"} ${onClick ? "cursor-pointer hover:bg-black/5" : ""}`}>
      <div className="min-w-0">
        <div className="text-sm truncate flex items-center gap-2" style={{ color: FOAM }}>
          {task.needsReview && !task.confirmed && <Icon name="sparkles" size={12} color={GOLD} />}
          {task.title}
        </div>
        <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">{proj && <Badge color={proj.color}>{proj.name}</Badge>}{cat && <Badge color={cat.color}>{cat.name}</Badge>}</div>
      </div>
      <div className="text-right shrink-0 ml-3"><div className="text-xs font-mono" style={{ color: overdue ? CORAL : MUTE }}>{fmt(task.due)}</div></div>
    </div>
  );
}

/* ============================== WORK LOG ============================== */
/* ============================== BOARD (Jira-style Kanban) ============================== */
const BOARD_COLUMNS = [
  { id: "todo", label: "TO DO", statuses: ["Not Started", "Waiting", "Deferred"], setStatus: "Not Started" },
  { id: "inprogress", label: "IN PROGRESS", statuses: ["In Progress"], setStatus: "In Progress" },
  { id: "done", label: "DONE", statuses: ["Completed"], setStatus: "Completed" },
];
function columnOf(status) { return BOARD_COLUMNS.find((c) => c.statuses.includes(status)) || BOARD_COLUMNS[0]; }
function projectCode(name) { return (name || "GEN").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "GEN"; }

function BoardView({ tasks, persistTasks, categories, projects, catMap, projMap, now }) {
  const [showAdd, setShowAdd] = useState(false);
  const [newTask, setNewTask] = useState({ title: "", project: projects[0]?.id, category: categories[0]?.id, dueDate: isoDate(now) });
  const [dragId, setDragId] = useState(null);
  const [commentOpenId, setCommentOpenId] = useState(null);
  const [commentDraft, setCommentDraft] = useState("");

  const idIndex = useMemo(() => Object.fromEntries(tasks.map((t, i) => [t.id, i + 1])), [tasks]);
  const activeBoard = useMemo(() => tasks
    .filter((t) => t.status !== "Cancelled" && !( !isRecurringTask(t) && t.status === "Completed" ))
    .map((t) => ({ ...t, due: nextOpenDue(t, now), isHistory: false }))
    .filter((t) => t.due), [tasks, now]);
  const historySummaries = useMemo(() => tasks
    .filter((t) => isRecurringTask(t) && (t.completedDates || []).length > 0)
    .map((t) => ({ ...t, isHistory: true, completionCount: t.completedDates.length, latestCompletion: [...t.completedDates].sort().at(-1) }))
    .sort((a, b) => String(b.latestCompletion).localeCompare(String(a.latestCompletion))), [tasks]);
  const completedOneOff = useMemo(() => tasks
    .filter((t) => !isRecurringTask(t) && t.status === "Completed")
    .map((t) => ({ ...t, due: nextDue(t.pattern, now), isHistory: false })), [tasks, now]);
  const needsReview = tasks.filter((t) => t.needsReview && !t.confirmed);
  const completedOccurrenceCount = tasks.reduce((sum, t) => sum + (t.completedDates || []).length + (!isRecurringTask(t) && t.status === "Completed" ? 1 : 0), 0);

  async function setTaskStatus(id, status) {
    await persistTasks(tasks.map((t) => (t.id === id ? { ...t, status } : t)));
  }
  async function completeTask(id, due) {
    const dateKey = isoDate(due);
    await persistTasks(tasks.map((t) => {
      if (t.id !== id) return t;
      if (!isRecurringTask(t)) return { ...t, status: "Completed" };
      const completedDates = [...new Set([...(t.completedDates || []), dateKey])].sort();
      return { ...t, completedDates, status: "Not Started" };
    }));
  }
  async function moveTask(id, columnId, due) {
    const col = BOARD_COLUMNS.find((c) => c.id === columnId);
    if (!col) return;
    const task = tasks.find((t) => t.id === id);
    if (!task) return;
    if (columnId === "done") return completeTask(id, due || nextOpenDue(task, now));
    await setTaskStatus(id, col.setStatus);
  }
  async function confirm(id) { await persistTasks(tasks.map((t) => (t.id === id ? { ...t, confirmed: true } : t))); }
  async function dismiss(id) { await persistTasks(tasks.filter((t) => t.id !== id)); }
  async function deleteTask(id) {
    const task = tasks.find((t) => t.id === id);
    if (!task) return;
    if (!window.confirm(`Delete “${task.title}”? This will also remove its saved completion history and comments.`)) return;
    await persistTasks(tasks.filter((t) => t.id !== id));
    if (commentOpenId === id) { setCommentOpenId(null); setCommentDraft(""); }
  }
  async function addComment(id) {
    const text = commentDraft.trim();
    if (!text) return;
    const comment = { id: "comment-" + Date.now(), text, createdAt: new Date().toISOString() };
    await persistTasks(tasks.map((t) => t.id === id ? { ...t, comments: [...(t.comments || []), comment] } : t));
    setCommentDraft("");
  }
  async function addTask(e) {
    e.preventDefault(); if (!newTask.title.trim()) return;
    const t = { id: "task-manual-" + Date.now(), title: newTask.title, project: newTask.project, category: newTask.category, periodGroup: "backlog", cadenceLabel: "One-off", pattern: { type: "once", date: newTask.dueDate }, status: "Not Started", priority: "Normal", estimatedHours: null, actualHours: null, source: "Manually Added", confirmed: true, notes: "", comments: [], completedDates: [] };
    await persistTasks([t, ...tasks]); setNewTask({ title: "", project: projects[0]?.id, category: categories[0]?.id, dueDate: isoDate(now) }); setShowAdd(false);
  }

  function CommentsPanel({ t }) {
    const comments = t.comments || [];
    const isOpen = commentOpenId === t.id;
    return (
      <div className="mt-2">
        <button onClick={() => { setCommentOpenId(isOpen ? null : t.id); setCommentDraft(""); }} className="text-xs font-medium" style={{ color: TEAL }}>
          {comments.length ? `💬 ${comments.length} comment${comments.length === 1 ? "" : "s"}` : "💬 Add comment"}
        </button>
        {isOpen && (
          <div className="mt-2 p-2" style={{ background: "#FAFBFC", border: "1px solid " + LINE, borderRadius: 3 }}>
            {comments.length > 0 && <div className="space-y-2 mb-2">{comments.map((c) => (
              <div key={c.id} className="text-xs p-2" style={{ background: SLATE, border: "1px solid " + LINE, borderRadius: 3 }}>
                <div style={{ color: FOAM, whiteSpace: "pre-wrap" }}>{c.text}</div>
                <div className="mt-1 font-mono" style={{ color: MUTE, fontSize: 10 }}>{new Date(c.createdAt).toLocaleString()}</div>
              </div>
            ))}</div>}
            <textarea value={commentDraft} onChange={(e) => setCommentDraft(e.target.value)} placeholder="Write a comment…" rows="2" className="w-full px-2.5 py-2 text-xs outline-none resize-y" style={inputStyle} />
            <div className="flex justify-end mt-2"><Button size="sm" icon="plus" onClick={() => addComment(t.id)}>Add comment</Button></div>
          </div>
        )}
      </div>
    );
  }

  function ActiveTicket({ t }) {
    const proj = projMap[t.project], cat = catMap[t.category];
    const col = columnOf(t.status);

              </div>
              <div style={{ maxHeight: "68vh", overflowY: "auto", paddingRight: 2 }}>

                  <>

              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function taskOccurrencesInRange(task, start, end) {
  if (!task?.pattern || task.status === "Cancelled") return [];
  const out = [];
  let cursor = new Date(start);
  cursor.setHours(0, 0, 0, 0);

  if (!isRecurringTask(task)) {
    const due = nextDue(task.pattern, cursor);
    if (due && due >= start && due <= end) out.push(due);
    return out;
  }

  for (let i = 0; i < 80; i++) {
    const due = nextDue(task.pattern, cursor);
    if (!due || due > end) break;
    if (due >= start) out.push(due);
    cursor = new Date(due.getTime() + 86400000);
  }
  return out;
}

function AnalyticsView({ tasks, categories, projects }) {
  const now = new Date();
  const year = now.getFullYear();
  const start = new Date(year, 0, 1);
  const end = new Date(year, 11, 31, 23, 59, 59);

  const monthly = Array.from({ length: 12 }, (_, month) => ({
    key: `${year}-${String(month + 1).padStart(2, "0")}`,
    name: `${MONTH_NAMES[month]} ${year}`,
    completed: 0,
    pending: 0,
  }));

  tasks.forEach((task) => {
    const completed = completedDateSet(task);
    taskOccurrencesInRange(task, start, end).forEach((due) => {
      const month = due.getMonth();
      const dateKey = isoDate(due);
      const isDone = isRecurringTask(task)
        ? completed.has(dateKey)
        : task.status === "Completed";
      if (isDone) monthly[month].completed += 1;
      else monthly[month].pending += 1;
    });
  });

  const completedThisYear = monthly.reduce((sum, m) => sum + m.completed, 0);
  const pendingThisYear = monthly.reduce((sum, m) => sum + m.pending, 0);
  const currentMonth = monthly[now.getMonth()];

  return (
    <div className="space-y-6">
      <div>
        <h1 className="text-2xl" style={{ color: FOAM }}>Analytics</h1>
        <p className="text-sm mt-1" style={{ color: MUTE }}>Tasks completed and pending by month for {year}.</p>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="Completed this year" value={completedThisYear} sub="scheduled task occurrences" />
        <StatCard label="Pending this year" value={pendingThisYear} sub="scheduled task occurrences" />
        <StatCard label={`${MONTH_NAMES[now.getMonth()]} completed`} value={currentMonth.completed} sub="this month" />
        <StatCard label={`${MONTH_NAMES[now.getMonth()]} pending`} value={currentMonth.pending} sub="this month" />
      </div>

      <Card className="p-5">
        <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
          <h2 className="text-sm font-medium" style={{ color: MUTE }}>Monthly task status</h2>
          <div className="flex items-center gap-4 text-xs">
            <span className="flex items-center gap-1.5" style={{ color: MUTE }}><span className="w-2 h-2 rounded-full" style={{ background: "#00875A" }} />Completed</span>
            <span className="flex items-center gap-1.5" style={{ color: MUTE }}><span className="w-2 h-2 rounded-full" style={{ background: GOLD }} />Pending</span>
          </div>
        </div>
        <MonthlyTaskChart data={monthly} />
      </Card>
    </div>
  );
}

const SALARY_TYPES = ["Basic Salary", "Overtime", "Allowance", "Bonus", "Deduction"];
function SalaryView({ salary, persistSalary, settings }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ month: isoDate(new Date()).slice(0, 7), type: "Basic Salary", amount: "", notes: "" });
  const currency = settings.currency || "MVR";

  async function addEntry(e) {
    e.preventDefault();
    if (!form.amount) return;
    const signedAmount = form.type === "Deduction" ? -Math.abs(Number(form.amount)) : Math.abs(Number(form.amount));
    const entry = { id: "sal-" + Date.now(), month: form.month, type: form.type, amount: signedAmount, notes: form.notes };
    await persistSalary([entry, ...salary]);
    setForm({ month: isoDate(new Date()).slice(0, 7), type: "Basic Salary", amount: "", notes: "" });
    setShowForm(false);
  }
  async function deleteEntry(id) { await persistSalary(salary.filter((s) => s.id !== id)); }

  const now = new Date();
  const thisYear = salary.filter((s) => s.month.startsWith(String(now.getFullYear())));
  const totalThisYear = thisYear.reduce((sum, s) => sum + s.amount, 0);
  const monthsWithEntries = new Set(thisYear.map((s) => s.month)).size;
  const avgPerMonth = monthsWithEntries ? totalThisYear / monthsWithEntries : 0;
  const latest = [...salary].sort((a, b) => b.month.localeCompare(a.month))[0];

  const byMonth = {};
  salary.forEach((s) => { byMonth[s.month] = (byMonth[s.month] || 0) + s.amount; });
  const chart = Object.keys(byMonth).sort().slice(-12).map((m) => { const [y, mo] = m.split("-").map(Number); return { name: `${MONTH_NAMES[mo - 1]} ${y}`, amount: byMonth[m] }; });

  const grouped = {};
  salary.forEach((s) => { (grouped[s.month] = grouped[s.month] || []).push(s); });
  const months = Object.keys(grouped).sort().reverse();

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl" style={{ color: FOAM }}>Salary</h1>
        <Button icon="plus" onClick={() => setShowForm((v) => !v)}>{showForm ? "Close" : "Add entry"}</Button>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
        <Card className="p-4"><div className="text-xs mb-1" style={{ color: MUTE }}>Total this year</div><Num size="text-2xl">{currency} {totalThisYear.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</Num></Card>
        <Card className="p-4"><div className="text-xs mb-1" style={{ color: MUTE }}>Avg / month</div><Num size="text-2xl">{currency} {avgPerMonth.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</Num></Card>
        <Card className="p-4 col-span-2 md:col-span-1"><div className="text-xs mb-1" style={{ color: MUTE }}>Latest entry</div><div className="text-base" style={{ color: FOAM }}>{latest ? `${currency} ${latest.amount.toLocaleString()}` : "—"}</div>{latest && <div className="text-xs mt-1" style={{ color: MUTE }}>{latest.type} · {latest.month}</div>}</Card>
      </div>

      {showForm && (
        <Card className="p-5">
          <form onSubmit={addEntry} className="grid sm:grid-cols-2 gap-x-4">
            <Field label="Month"><TextInput type="month" value={form.month} onChange={(e) => setForm({ ...form, month: e.target.value })} /></Field>
            <Field label="Type"><Select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>{SALARY_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></Field>
            <Field label={`Amount (${currency})`}><TextInput type="number" step="0.01" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} placeholder="0.00" /></Field>
            <Field label="Notes"><TextInput value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Optional" /></Field>
            <div className="sm:col-span-2"><Button type="submit" icon="check">Save entry</Button></div>
          </form>
        </Card>
      )}

      {chart.length > 0 && (
        <Card className="p-5">
          <h2 className="text-sm font-medium mb-3" style={{ color: MUTE }}>Monthly total (last 12 months with entries)</h2>
          <div className="space-y-3">
            {chart.map((d, i) => {
              const max = Math.max(1, ...chart.map((c) => Math.abs(c.amount)));
              return (
                <div key={i}>
                  <div className="flex justify-between text-xs mb-1"><span style={{ color: FOAM }}>{d.name}</span><span className="font-mono" style={{ color: MUTE }}>{currency} {d.amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span></div>
                  <div className="h-2 rounded-full overflow-hidden" style={{ background: "rgba(23,43,77,0.08)" }}>
                    <div className="h-full rounded-full" style={{ width: `${(Math.abs(d.amount) / max) * 100}%`, background: d.amount < 0 ? CORAL : TEAL }} />
                  </div>
                </div>
              );
            })}

        </Card>

            {months.map((m) => {

              return (
                <div key={m} className="px-5 py-3">
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="text-xs uppercase tracking-wide" style={{ color: GOLD }}>{MONTH_NAMES[mo - 1]} {y}</span>

                  {grouped[m].map((e) => (
                    <div key={e.id} className="flex items-center justify-between text-sm py-1">
                      <div><span style={{ color: FOAM }}>{e.type}</span>{e.notes && <span className="ml-2" style={{ color: MUTE }}>{e.notes}</span>}</div>
                      <div className="flex items-center gap-3">
                        <span className="font-mono" style={{ color: e.amount < 0 ? CORAL : MUTE }}>{e.amount < 0 ? "-" : ""}{currency} {Math.abs(e.amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        <button onClick={() => deleteEntry(e.id)}><Icon name="trash" size={13} color={MUTE} /></button>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ============================== REPORTS ============================== */
function ReportsView({ tasks, categories, projects, catMap, projMap, now }) {
  const [period, setPeriod] = useState("weekly");
  const [copied, setCopied] = useState(false);
  const range = useMemo(() => {
    if (period === "weekly") { const s = startOfWeek(now); return [s, new Date(s.getTime() + 6 * 86400000)]; }
    if (period === "monthly") { return [new Date(now.getFullYear(), now.getMonth(), 1), lastDayOfMonth(now.getFullYear(), now.getMonth())]; }
    return [quarterStartDate(now), quarterEndDate(now)];
  }, [period, now]);
  const completedTasks = completionEvents(tasks).filter((e) => e.due >= range[0] && e.due <= new Date(range[1].getTime() + 86399999));
  const outstanding = tasks.filter((t) => t.status !== "Cancelled" && !( !isRecurringTask(t) && t.status === "Completed" )).map((t) => ({ ...t, due: nextOpenDue(t, now) })).filter((t) => t.due);
  const inProgress = outstanding.filter((t) => t.status === "In Progress");
  const byCat = categories.map((c) => ({ name: c.name, count: completedTasks.filter((t) => t.category === c.id).length })).filter((d) => d.count > 0);
  const reportText = `${period.toUpperCase()} WORK REPORT
${fmt(range[0])} – ${fmt(range[1])}

Completed: ${completedTasks.length}
In progress: ${inProgress.length}
Outstanding: ${outstanding.length}

Completed by category:
${byCat.map((c) => `  ${c.name}: ${c.count}`).join("\n") || "  (none logged)"}

Work completed:
${completedTasks.slice(0, 10).map((t) => `  • ${t.title}`).join("\n") || "  (none marked complete)"}

Outstanding work:
${outstanding.slice(0, 10).map((t) => `  • ${t.title} — due ${fmt(t.due)}`).join("\n") || "  (none)"}
`;
  function copy() { navigator.clipboard?.writeText(reportText); setCopied(true); setTimeout(() => setCopied(false), 1500); }
  function downloadCSV() {
    const rows = [["Title", "Status", "Category", "Project", "Due date"], ...tasks.map((t) => [t.title, t.status, catMap[t.category]?.name || "", projMap[t.project]?.name || "", fmt(nextOpenDue(t, now) || nextDue(t.pattern, now))])];
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" }); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "task-export.csv"; a.click(); URL.revokeObjectURL(url);
  }
  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h1 className="text-2xl" style={{ color: FOAM }}>Reports</h1>
        <div className="flex gap-2">{["weekly", "monthly", "quarterly"].map((p) => (
          <button key={p} onClick={() => setPeriod(p)} className="px-3 py-1.5 text-xs capitalize" style={{ background: period === p ? TEAL : "transparent", color: period === p ? ON_ACCENT : MUTE, borderRadius: 3, border: period === p ? "none" : "1px solid " + LINE }}>{p}</button>
        ))}</div>
      </div>
      <Card className="p-5">
        <pre className="text-sm whitespace-pre-wrap font-mono" style={{ color: FOAM, fontFamily: "'JetBrains Mono', monospace" }}>{reportText}</pre>
        <div className="flex gap-2 mt-4"><Button icon="check" onClick={copy}>{copied ? "Copied" : "Copy report"}</Button><Button variant="ghost" icon="download" onClick={downloadCSV}>Export tasks CSV</Button></div>
      </Card>
    </div>
  );
}

/* ============================== LEAVES ============================== */
const LEAVE_TYPES = [
  "Government Holiday", "Annual Leave", "FRL (Family Responsibility Leave)",
  "Sick Leave (with MC)", "Sick Leave (without MC)", "Paternity Leave", "Circumcision Leave",
];
function LeavesView({ leaves, persistLeaves }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ type: LEAVE_TYPES[0], startDate: isoDate(new Date()), endDate: isoDate(new Date()), notes: "" });

  async function addEntry(e) {
    e.preventDefault();
    const days = daysBetween(new Date(form.startDate), new Date(form.endDate)) + 1;
    const entry = { id: "leave-" + Date.now(), type: form.type, startDate: form.startDate, endDate: form.endDate, days: Math.max(1, days), notes: form.notes };
    await persistLeaves([entry, ...leaves]);
    setForm({ type: LEAVE_TYPES[0], startDate: isoDate(new Date()), endDate: isoDate(new Date()), notes: "" });
    setShowForm(false);
  }
  async function deleteEntry(id) { await persistLeaves(leaves.filter((l) => l.id !== id)); }

  const now = new Date();
  const thisYear = leaves.filter((l) => new Date(l.startDate).getFullYear() === now.getFullYear());
  const totalDaysThisYear = thisYear.reduce((s, l) => s + l.days, 0);
  const byType = LEAVE_TYPES.map((t) => ({ name: t, days: thisYear.filter((l) => l.type === t).reduce((s, l) => s + l.days, 0) })).filter((d) => d.days > 0);
  const maxDays = Math.max(1, ...byType.map((d) => d.days));
  const grouped = {};
  leaves.forEach((l) => { (grouped[l.type] = grouped[l.type] || []).push(l); });

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl" style={{ color: FOAM }}>Leaves</h1>
        <Button icon="plus" onClick={() => setShowForm((v) => !v)}>{showForm ? "Close" : "Add entry"}</Button>
      </div>
      <div className="grid grid-cols-2 gap-4">
        <Card className="p-4"><div className="text-xs mb-1" style={{ color: MUTE }}>Total days this year</div><Num size="text-2xl">{totalDaysThisYear}</Num></Card>
        <Card className="p-4"><div className="text-xs mb-1" style={{ color: MUTE }}>Types used</div><Num size="text-2xl">{byType.length}</Num></Card>
      </div>
      {showForm && (
        <Card className="p-5">
          <form onSubmit={addEntry} className="grid sm:grid-cols-2 gap-x-4">
            <div className="sm:col-span-2"><Field label="Type"><Select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>{LEAVE_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></Field></div>
            <Field label="Start date"><TextInput type="date" value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} /></Field>
            <Field label="End date"><TextInput type="date" value={form.endDate} onChange={(e) => setForm({ ...form, endDate: e.target.value })} /></Field>
            <div className="sm:col-span-2"><Field label="Notes"><TextInput value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Optional" /></Field></div>
            <div className="sm:col-span-2"><Button type="submit" icon="check">Save entry</Button></div>
          </form>
        </Card>
      )}
      {byType.length > 0 && (
        <Card className="p-5">
          <h2 className="text-sm font-medium mb-3" style={{ color: MUTE }}>Days by type (this year)</h2>
          <div className="space-y-3">
            {byType.map((d, i) => (
              <div key={i}>
                <div className="flex justify-between text-xs mb-1"><span style={{ color: FOAM }}>{d.name}</span><span className="font-mono" style={{ color: MUTE }}>{d.days}d</span></div>
                <div className="h-2 rounded-full overflow-hidden" style={{ background: "rgba(23,43,77,0.08)" }}><div className="h-full rounded-full" style={{ width: `${(d.days / maxDays) * 100}%`, background: GOLD }} /></div>
              </div>
            ))}
          </div>
        </Card>
      )}
      <Card>
        {leaves.length === 0 ? <EmptyState icon="leaves" title="No leave recorded yet" body="Add annual leave, sick leave, government holidays, and more here — organized by type." /> : (
          <div className="divide-y" style={{ borderColor: "rgba(23,43,77,0.06)" }}>
            {LEAVE_TYPES.filter((t) => grouped[t]?.length).map((t) => (
              <div key={t} className="px-5 py-3">
                <div className="text-xs uppercase tracking-wide mb-2" style={{ color: GOLD }}>{t}</div>
                {grouped[t].sort((a, b) => new Date(b.startDate) - new Date(a.startDate)).map((l) => (
                  <div key={l.id} className="flex items-center justify-between text-sm py-1">
                    <div><span style={{ color: FOAM }}>{fmt(l.startDate)}{l.startDate !== l.endDate ? ` – ${fmt(l.endDate)}` : ""}</span>{l.notes && <span className="ml-2" style={{ color: MUTE }}>{l.notes}</span>}</div>
                    <div className="flex items-center gap-3"><span className="font-mono" style={{ color: MUTE }}>{l.days}d</span><button onClick={() => deleteEntry(l.id)}><Icon name="trash" size={13} color={MUTE} /></button></div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ============================== SETTINGS ============================== */
function SettingsView({ settings, persistSettings, categories, persistCategories, projects, persistProjects }) {
  const [local, setLocal] = useState(settings);
  const [newCat, setNewCat] = useState("");
  const [newProj, setNewProj] = useState("");
  async function save() { await persistSettings(local); }
  async function addCategory() { if (!newCat.trim()) return; await persistCategories([...categories, { id: "cat-" + Date.now(), name: newCat.trim(), color: "#8A8A8A" }]); setNewCat(""); }
  async function removeCategory(id) { await persistCategories(categories.filter((c) => c.id !== id)); }
  async function addProject() { if (!newProj.trim()) return; await persistProjects([...projects, { id: "proj-" + Date.now(), name: newProj.trim(), color: "#8A8A8A", source: "Manual" }]); setNewProj(""); }
  async function removeProject(id) { await persistProjects(projects.filter((p) => p.id !== id)); }
  return (
    <div className="space-y-6 max-w-2xl">
      <h1 className="text-2xl" style={{ color: FOAM }}>Settings</h1>
      <Card className="p-5">
        <h2 className="text-sm font-medium mb-3" style={{ color: MUTE }}>Profile</h2>
        <Field label="Your name"><TextInput value={local.name} onChange={(e) => setLocal({ ...local, name: e.target.value })} /></Field>
        <Field label="Currency"><TextInput value={local.currency || "MVR"} onChange={(e) => setLocal({ ...local, currency: e.target.value })} /></Field>
        <Button icon="check" onClick={save}>Save settings</Button>
      </Card>
      <Card className="p-5">
        <h2 className="text-sm font-medium mb-3" style={{ color: MUTE }}>Categories</h2>
        <div className="space-y-1.5 mb-3">{categories.map((c) => (
          <div key={c.id} className="flex items-center justify-between text-sm"><Badge color={c.color}>{c.name}</Badge><button onClick={() => removeCategory(c.id)}><Icon name="trash" size={13} color={MUTE} /></button></div>
        ))}</div>
        <div className="flex gap-2"><TextInput value={newCat} onChange={(e) => setNewCat(e.target.value)} placeholder="New category" /><Button icon="plus" onClick={addCategory}>Add</Button></div>
      </Card>
      <Card className="p-5">
        <h2 className="text-sm font-medium mb-3" style={{ color: MUTE }}>Projects</h2>
        <div className="space-y-1.5 mb-3">{projects.map((p) => (
          <div key={p.id} className="flex items-center justify-between text-sm"><Badge color={p.color}>{p.name}</Badge><button onClick={() => removeProject(p.id)}><Icon name="trash" size={13} color={MUTE} /></button></div>
        ))}</div>
        <div className="flex gap-2"><TextInput value={newProj} onChange={(e) => setNewProj(e.target.value)} placeholder="New project" /><Button icon="plus" onClick={addProject}>Add</Button></div>
      </Card>
      <Card className="p-5">
        <h2 className="text-sm font-medium mb-3" style={{ color: MUTE }}>Integrations</h2>
        <div className="text-sm space-y-2" style={{ color: FOAM }}>
          <div className="flex items-center gap-2"><Icon name="refresh" size={14} color={TEAL} /> Todoist — read-only snapshot, taken 12 Aug 2026</div>
          <div className="flex items-center gap-2"><Icon name="refresh" size={14} color={TEAL} /> Calendar — read-only snapshot, taken 12 Aug 2026</div>
        </div>
        <p className="text-xs mt-3" style={{ color: MUTE }}>Data syncs to your Firebase account. It can't call Todoist or Calendar live — ask Claude to regenerate this file when your recurring tasks change.</p>
      </Card>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
</body>
